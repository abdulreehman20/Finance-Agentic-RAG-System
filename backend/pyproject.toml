[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sentry-sdk>=2.64.0",
    "structlog>=26.1.0",
    "psycopg>=3.3.4",
    "sqlmodel>=0.0.39",
    "psycopg2-binary>=2.9.12",
    "clerk-backend-api>=6.0.1",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "langchain>=1.3.13",
    "langchain-openrouter>=0.2.6",
    "joserfc>=1.7.3",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
